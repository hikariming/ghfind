name: Deploy production (Cloudflare)

# Replaces the retired Vercel/Railway gate: ghfind.com is now served by the
# Next-on-Workers (OpenNext) build. This workflow is production-owned by
# hikariming/ghfind; a copied workflow in a fork must fail its provenance guard.
# A successful CI run for a `main` commit is the only automatic production
# trigger; main branch protection is optional. The workflow checks out the exact
# SHA that CI verified, then runs the build, `wrangler deploy --env production`,
# R2 incremental-cache population, and a read-only public smoke. Any failure
# after the rollback anchor is captured restores the previous Worker version.
# Frontend and backend are one Worker in the current topology, so that single
# rollback covers both request surfaces.
#
# Required GitHub secrets:
# - CF_API_TOKEN — Cloudflare API token ("Edit Cloudflare Workers" template)
# The account ID is intentionally pinned below to Beiming1201@gmail.com's Account.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-cf-production-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to Cloudflare Workers (production)
    if: ${{ github.repository == 'hikariming/ghfind' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.repository.full_name == 'hikariming/ghfind' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      EXPECTED_REPOSITORY: hikariming/ghfind
      EXPECTED_ACCOUNT_ID: 8f19bebe359e4ec1a24c68c5f49c1584
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      CF_VERSION_TAG: main-${{ github.event.workflow_run.head_sha }}
      CF_VERSION_MESSAGE: release-${{ github.event.workflow_run.head_sha }}-from-upstream-main
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Verify upstream/main provenance
        env:
          SOURCE_REPOSITORY: ${{ github.event.workflow_run.repository.full_name }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$SOURCE_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$SOURCE_BRANCH" = "main"
          test "$SOURCE_SHA" = "$RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          case "$SOURCE_SHA" in
            [0-9a-fA-F][0-9a-fA-F][0-9a-fA-F]*) ;;
            *) echo "workflow_run head_sha is not a commit SHA" >&2; exit 1 ;;
          esac
          {
            echo "### Release provenance"
            echo "- Repository: \`$SOURCE_REPOSITORY\`"
            echo "- Branch: \`$SOURCE_BRANCH\`"
            echo "- Commit: \`$SOURCE_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # No `version:` — pnpm/action-setup reads packageManager from
      # package.json (pnpm@11.24.0); pinning a second version here breaks the
      # setup step with ERR_PNPM_BAD_PM_VERSION.
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Capture rollback target
        id: release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "8f19bebe359e4ec1a24c68c5f49c1584"
        run: |
          set -euo pipefail
          test "$CLOUDFLARE_ACCOUNT_ID" = "$EXPECTED_ACCOUNT_ID"
          status_file="$RUNNER_TEMP/cf-production-before.json"
          pnpm exec wrangler deployments status \
            --name ghfind \
            --env production \
            --json > "$status_file"
          previous_version="$(
            cat "$status_file" \
              | jq -er '.versions | if length == 1 and .[0].percentage == 100 then .[0].version_id else error("production is not a single 100% deployment") end'
          )"
          if [[ ! "$previous_version" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            echo "Cloudflare returned an invalid rollback version id" >&2
            exit 1
          fi
          # The API credential may be a delegated user token. The deployment
          # target is enforced by the pinned account ID above; the author is
          # audit metadata and must not be used as an account-ownership gate.
          previous_author="$(jq -r '.author_email // "unknown"' < "$status_file")"
          echo "previous_version=$previous_version" >> "$GITHUB_OUTPUT"
          {
            echo "### Cloudflare production release"
            echo "- Commit: \`$RELEASE_SHA\`"
            echo "- Account: \`$CLOUDFLARE_ACCOUNT_ID\`"
            echo "- Previous active author (audit metadata only): \`$previous_author\`"
            echo "- Rollback target: \`$previous_version\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply and verify production D1 migrations
        id: migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "8f19bebe359e4ec1a24c68c5f49c1584"
        run: |
          set -euo pipefail
          test "$CLOUDFLARE_ACCOUNT_ID" = "$EXPECTED_ACCOUNT_ID"
          # Wrangler skips the confirmation prompt in CI and captures a D1
          # backup. This must complete before the first v10 write can replace
          # a v9 row; otherwise the immutable read fallback cannot be used.
          release_config="$(node scripts/feed-platform-schema-release.mjs production "$RUNNER_TEMP/approved-application-schema")"
          pnpm exec wrangler d1 migrations apply ghfind --remote --config "$release_config"
          pnpm exec wrangler d1 migrations apply ghfind-feed --remote --config "$release_config"
          core_schema_file="$RUNNER_TEMP/cf-production-core-schema.json"
          pnpm exec wrangler d1 execute ghfind --remote --env production --json \
            --command "SELECT COUNT(*) AS risk_columns FROM pragma_table_info('scores') WHERE name IN ('risk_assessment','risk_notes'); SELECT COUNT(*) AS fallback_tables FROM sqlite_master WHERE type='table' AND name='score_release_fallbacks';" \
            > "$core_schema_file"
          jq -e '.[0].results[0].risk_columns == 2 and .[1].results[0].fallback_tables == 1' "$core_schema_file" >/dev/null
          feed_schema_file="$RUNNER_TEMP/cf-production-feed-schema.json"
          pnpm exec wrangler d1 execute ghfind-feed --remote --env production --json \
            --command "SELECT COUNT(*) AS feed_tables FROM sqlite_master WHERE type='table' AND name IN ('feed_taxonomy_versions','feed_tag_definitions','feed_tag_aliases','feed_projects','feed_project_moderation','feed_project_tags','feed_tag_proposals','feed_users','feed_user_tag_preferences','feed_user_project_states','feed_events','feed_served_items','feed_rate_windows'); SELECT COUNT(*) AS active_feed_taxonomy FROM feed_taxonomy_versions WHERE version = 1 AND status = 'active'; SELECT COUNT(*) AS canonical_feed_tags FROM feed_tag_definitions WHERE status = 'canonical' AND taxonomy_version = 1;" \
            > "$feed_schema_file"
          jq -e '.[0].results[0].feed_tables == 13 and .[1].results[0].active_feed_taxonomy == 1 and .[2].results[0].canonical_feed_tags == 13' "$feed_schema_file" >/dev/null
          {
            echo "### Production D1 schema"
            echo "- Migrations applied; v10 read fallback and Cloudflare Feed D1 schema/taxonomy verified before Worker deployment."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy (build + wrangler deploy --env production + populateCache)
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "8f19bebe359e4ec1a24c68c5f49c1584"
        run: |
          test "$CLOUDFLARE_ACCOUNT_ID" = "$EXPECTED_ACCOUNT_ID"
          pnpm cf:deploy:prod

      - name: Confirm a single 100% version is active
        id: active
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "8f19bebe359e4ec1a24c68c5f49c1584"
        run: |
          set -euo pipefail
          test "$CLOUDFLARE_ACCOUNT_ID" = "$EXPECTED_ACCOUNT_ID"
          active_version="$(
            pnpm exec wrangler deployments status \
              --name ghfind \
              --env production \
              --json \
              | jq -er '.versions | if length == 1 and .[0].percentage == 100 then .[0].version_id else error("production is not a single 100% deployment") end'
          )"
          echo "active_version=$active_version" >> "$GITHUB_OUTPUT"
          echo "- New active Worker version: \`$active_version\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Post-deploy read-only smoke
        id: smoke
        env:
          SMOKE_BASE_URL: https://ghfind.com
          SMOKE_CANARY_HANDLE: octocat
          SMOKE_FACET_TYPE: language
          SMOKE_FACET_VALUE: TypeScript
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if pnpm smoke:deployment; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 5
            fi
          done
          exit 1

      - name: Roll back frontend and backend Worker
        id: rollback
        # A migration/schema failure happens before the Worker can change and
        # must not issue a redundant rollback. Only a failure after the deploy
        # step started is eligible for the single Worker rollback.
        if: ${{ failure() && steps.release.outputs.previous_version != '' && (steps.deploy.outcome == 'failure' || steps.active.outcome == 'failure' || steps.smoke.outcome == 'failure') }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "8f19bebe359e4ec1a24c68c5f49c1584"
          PREVIOUS_VERSION: ${{ steps.release.outputs.previous_version }}
        run: |
          set -euo pipefail
          test "$CLOUDFLARE_ACCOUNT_ID" = "$EXPECTED_ACCOUNT_ID"
          pnpm exec wrangler rollback "$PREVIOUS_VERSION" \
            --name ghfind \
            --env production \
            --message "rollback: post-deploy verification failed for $RELEASE_SHA" \
            --yes
          active_version="$(
            pnpm exec wrangler deployments status \
              --name ghfind \
              --env production \
              --json \
              | jq -er '.versions | if length == 1 and .[0].percentage == 100 then .[0].version_id else error("production is not a single 100% deployment") end'
          )"
          test "$active_version" = "$PREVIOUS_VERSION"
          {
            echo "### Automatic rollback"
            echo "- Restored Worker version: \`$PREVIOUS_VERSION\`"
            echo "- Failed release commit: \`$RELEASE_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify rollback
        id: rollback_smoke
        if: ${{ always() && steps.rollback.outcome == 'success' }}
        env:
          SMOKE_BASE_URL: https://ghfind.com
          SMOKE_CANARY_HANDLE: octocat
          SMOKE_FACET_TYPE: language
          SMOKE_FACET_VALUE: TypeScript
        run: pnpm smoke:deployment

      - name: Report unrecoverable release state
        if: ${{ always() && failure() && ((steps.release.outcome != 'success') || ((steps.deploy.outcome == 'failure' || steps.active.outcome == 'failure' || steps.smoke.outcome == 'failure') && steps.rollback.outcome != 'success') || steps.rollback_smoke.outcome == 'failure') }}
        run: |
          {
            echo "### Manual intervention required"
            echo "Automatic rollback did not complete successfully. Inspect the Cloudflare deployment status and restore the last known-good Worker version before retrying."
          } >> "$GITHUB_STEP_SUMMARY"
