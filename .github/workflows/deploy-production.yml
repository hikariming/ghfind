name: Deploy production

# ghfind.com is served by the OpenNext Worker declared in wrangler.jsonc.
# Every main push deploys that Worker and then exercises the public Worker
# contract. No Vercel, Railway, RabbitMQ, or cross-origin backend is involved.
#
# Required GitHub production-environment secrets:
# - CLOUDFLARE_API_TOKEN: scoped to the account owning the ghfind Worker, with
#   Workers Scripts, D1 and R2 write access (R2 is used by populateCache).
# - CLOUDFLARE_ACCOUNT_ID: the account that owns the Worker and bindings.
#
# Required non-secret production-environment variables:
# - SMOKE_CANARY_HANDLE, SMOKE_FACET_TYPE, SMOKE_FACET_VALUE.
# See docs/operations/cloudflare-worker-runbook.md before changing this flow.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, deploy, and smoke Cloudflare Worker
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SMOKE_BASE_URL: https://ghfind.com
      SMOKE_CANARY_HANDLE: ${{ vars.SMOKE_CANARY_HANDLE }}
      SMOKE_FACET_TYPE: ${{ vars.SMOKE_FACET_TYPE }}
      SMOKE_FACET_VALUE: ${{ vars.SMOKE_FACET_VALUE }}
      SMOKE_CAMPAIGN: ${{ vars.SMOKE_CAMPAIGN }}
    steps:
      - name: Check required deployment configuration
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SMOKE_CANARY_HANDLE SMOKE_FACET_TYPE SMOKE_FACET_VALUE; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub production-environment configuration:$missing"
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Worker build
        run: pnpm cf:build:prod

      - name: Deploy Worker and populate incremental cache
        run: pnpm cf:deploy:prod

      - name: Read-only production smoke
        run: pnpm smoke:deployment
