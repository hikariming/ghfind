name: GitHub App checks
on:
  # Needs the assembled workspace (release bot key), so it runs after merge.
  push:
    branches: [main]
jobs:
  app:
    runs-on: ubuntu-latest
    # The release bot key is only available in protected environments (main/deploy).
    environment: release
    timeout-minutes: 10
    defaults:
      run:
        working-directory: platform/github-app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Assemble workspace (ghfind-server + ghfind-frontend)
        uses: ./.github/actions/assemble
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
