name: GitHub App checks
on:
  pull_request:
    paths: ['platform/github-app/**', '.github/workflows/github-app-checks.yml']
  push:
    branches: [main, 'codex/github-app']
    paths: ['platform/github-app/**', '.github/workflows/github-app-checks.yml']
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: platform/github-app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'hikariming/ghfind'
    needs: app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: platform/github-app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Deploy ghfind-bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 8f19bebe359e4ec1a24c68c5f49c1584
          WRANGLER_SEND_METRICS: "false"
        run: pnpm exec wrangler deploy --env production
