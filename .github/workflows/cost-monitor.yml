name: Cloudflare cost monitor

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      exercise:
        description: Verify production health and send isolated simulated alert emails
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: cost-monitor-deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_MONITOR_API_TOKEN: ${{ secrets.CF_MONITOR_API_TOKEN }}
      MONITOR_ADMIN_TOKEN: ${{ secrets.COST_MONITOR_ADMIN_TOKEN }}
      ALERT_RECIPIENTS: ${{ secrets.COST_MONITOR_RECIPIENTS }}
      PROBE_GITHUB_LOGIN: ${{ secrets.COST_MONITOR_PROBE_GITHUB_LOGIN }}
      CF_ZONE_ID: ${{ vars.COST_MONITOR_ZONE_ID }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Reject superseded release and incomplete private configuration
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" != "$RELEASE_SHA" ]; then
            echo "::notice::superseded"
            echo "current=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"
          test "$CLOUDFLARE_ACCOUNT_ID" = "8f19bebe359e4ec1a24c68c5f49c1584"
          test -n "$CF_MONITOR_API_TOKEN"
          test -n "$MONITOR_ADMIN_TOKEN"
          test -n "$ALERT_RECIPIENTS"
          test -n "$PROBE_GITHUB_LOGIN"
      - run: pnpm install --frozen-lockfile
        if: steps.current.outputs.current == 'true'
      - name: Deploy independent monitor with private recipient list
        if: steps.current.outputs.current == 'true'
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/cost-monitor-secrets.json`,JSON.stringify({CF_MONITOR_API_TOKEN:process.env.CF_MONITOR_API_TOKEN,MONITOR_ADMIN_TOKEN:process.env.MONITOR_ADMIN_TOKEN,ALERT_RECIPIENTS:process.env.ALERT_RECIPIENTS,PROBE_GITHUB_LOGIN:process.env.PROBE_GITHUB_LOGIN,...(process.env.CF_ZONE_ID?{CF_ZONE_ID:process.env.CF_ZONE_ID}:{})}),{mode:0o600});
          JS
          pnpm --filter @ghfind/cost-monitor exec wrangler secret bulk "$RUNNER_TEMP/cost-monitor-secrets.json" --env production
          rm "$RUNNER_TEMP/cost-monitor-secrets.json"
          pnpm --filter @ghfind/cost-monitor exec wrangler deploy --env production --keep-vars --tag "production-$RELEASE_SHA"
      - name: Verify deployed monitor collects live metrics
        if: steps.current.outputs.current == 'true'
        env:
          COST_MONITOR_URL: ${{ vars.COST_MONITOR_URL }}
          TRAFFIC_PREVIEW_PUBLIC_KEY: ${{ vars.TRAFFIC_PREVIEW_PUBLIC_KEY }}
        run: |
          node scripts/cost-monitor-verify.mjs
          node scripts/traffic-report-preview.mjs
      - name: Save encrypted traffic preview
        if: steps.current.outputs.current == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: traffic-report-preview
          path: ${{ runner.temp }}/ghfind-traffic-preview.encrypted.json
          retention-days: 7
  watchdog:
    if: github.event_name != 'workflow_run' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: cost-monitor-watchdog
      cancel-in-progress: false
    env:
      COST_MONITOR_URL: ${{ vars.COST_MONITOR_URL }}
      MONITOR_ADMIN_TOKEN: ${{ secrets.COST_MONITOR_ADMIN_TOKEN }}
      CF_MONITOR_API_TOKEN: ${{ secrets.CF_MONITOR_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      MONITOR_OPS_RECIPIENTS: ${{ secrets.COST_MONITOR_OPS_RECIPIENTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Cache contains only incident timestamps and keyed recipient hashes. The
      # serialized job restores the latest snapshot; unused snapshots expire
      # under Actions' seven-day cache eviction policy, without extra permissions.
      - name: Restore watchdog notification state
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/cost-monitor-watchdog/state.json
          key: cost-monitor-watchdog-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: cost-monitor-watchdog-v1-
      - name: Check monitor heartbeat and notify configured operators
        id: watchdog
        env:
          WATCHDOG_STATE_FILE: ${{ runner.temp }}/cost-monitor-watchdog/state.json
        run: node scripts/cost-monitor-watchdog.mjs
      - name: Preserve accepted notifications even when the monitor is unhealthy
        if: always() && steps.watchdog.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/cost-monitor-watchdog/state.json
          key: cost-monitor-watchdog-v1-${{ github.run_id }}-${{ github.run_attempt }}

  exercise:
    if: github.event_name == 'workflow_dispatch' && inputs.exercise && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: cost-monitor-exercise
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_MONITOR_API_TOKEN: ${{ secrets.CF_MONITOR_API_TOKEN }}
      MONITOR_ADMIN_TOKEN: ${{ secrets.COST_MONITOR_ADMIN_TOKEN }}
      ALERT_RECIPIENTS: ${{ secrets.COST_MONITOR_RECIPIENTS }}
      PROBE_GITHUB_LOGIN: ${{ secrets.COST_MONITOR_PROBE_GITHUB_LOGIN }}
      COST_MONITOR_URL: ${{ vars.COST_MONITOR_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify production and deploy isolated rehearsal worker
        run: |
          set -euo pipefail
          node scripts/cost-monitor-verify.mjs
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/cost-monitor-e2e-secrets.json`,JSON.stringify({CF_MONITOR_API_TOKEN:process.env.CF_MONITOR_API_TOKEN,MONITOR_ADMIN_TOKEN:process.env.MONITOR_ADMIN_TOKEN,ALERT_RECIPIENTS:process.env.ALERT_RECIPIENTS,PROBE_GITHUB_LOGIN:process.env.PROBE_GITHUB_LOGIN}),{mode:0o600});
          JS
          pnpm --filter @ghfind/cost-monitor exec wrangler secret bulk "$RUNNER_TEMP/cost-monitor-e2e-secrets.json" --env e2e
          rm "$RUNNER_TEMP/cost-monitor-e2e-secrets.json"
          pnpm --filter @ghfind/cost-monitor exec wrangler deploy --env e2e --keep-vars
      - name: Verify health and simulated email subjects
        run: node scripts/cost-monitor-rehearsal.mjs
