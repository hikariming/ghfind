name: Scoring release

# Publishes the public scoring module as packages (npm + Go). Deploying ghfind is
# separate: repository releases (vX.Y.Z, release.yml) feed compose-release.yml,
# which deploys the latest verified release of all three repositories.
#
#   git tag scoring/v0.2.0 && git push origin scoring/v0.2.0
#
# One tag versions all three runtimes:
#   Go      github.com/hikariming/ghfind/scoring@v0.2.0  (the tag itself; nested-module tag format)
#   npm     @ghfind/scoring@0.2.0                       (published only when vars.SCORING_NPM_PUBLISH == 'true')
#   fixtures ship inside both.
#
# Security model: this workflow runs only for tags pushed by maintainers, never
# for pull_request / pull_request_target. The npm token lives in the
# `scoring-release` environment (add required reviewers there).

on:
  push:
    tags: ["scoring/v*"]

permissions:
  contents: read

concurrency:
  group: scoring-release
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/scoring.yml

  release:
    name: Publish and notify backend
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: scoring-release
    permissions:
      contents: write   # create the GitHub release
      id-token: write   # npm provenance
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve version and check it matches scoring/package.json
        id: version
        run: |
          version="${TAG#scoring/v}"
          pkg="$(node -p 'require("./scoring/package.json").version')"
          if [ "$version" != "$pkg" ]; then
            echo "::error::tag $TAG does not match scoring/package.json version $pkg"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: ${{ vars.SCORING_NPM_REGISTRY || 'https://registry.npmjs.org' }}

      - name: Pack npm tarball
        working-directory: scoring
        run: |
          npm pkg delete private devDependencies scripts
          npm pack --pack-destination "$RUNNER_TEMP"
          ls -l "$RUNNER_TEMP"/*.tgz

      - name: Publish @ghfind/scoring
        if: vars.SCORING_NPM_PUBLISH == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.SCORING_NPM_TOKEN }}
        run: npm publish "$RUNNER_TEMP"/ghfind-scoring-*.tgz --access public --provenance

      - name: Warm the Go module proxy
        run: |
          curl -fsS "https://proxy.golang.org/github.com/hikariming/ghfind/scoring/@v/v${{ steps.version.outputs.version }}.info" || \
            echo "::warning::proxy.golang.org has not indexed the tag yet; go get will fetch it on demand"

      - name: GitHub release with the tarball and fixtures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf "$RUNNER_TEMP/scoring-fixtures.tgz" -C scoring fixtures rules
          gh release create "$TAG" "$RUNNER_TEMP"/ghfind-scoring-*.tgz "$RUNNER_TEMP/scoring-fixtures.tgz" \
            --repo "$GITHUB_REPOSITORY" --title "scoring v${{ steps.version.outputs.version }}" --generate-notes --verify-tag
