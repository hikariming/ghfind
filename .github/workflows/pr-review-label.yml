name: PR review level

on:
  pull_request_target:
    types: [opened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # pull_request_target uses the trusted base context. Never run PR head code.
      - name: Check out trusted base commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/pr-review-label.mts
          sparse-checkout-cone-mode: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Pre-create all five review-level labels in repository settings.
      # Node runs this dependency-free script directly; no install step is needed.
      - name: Sync review level
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node --experimental-strip-types scripts/pr-review-label.mts
