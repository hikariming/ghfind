name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      feed-postgres:
        image: pgvector/pgvector:0.8.1-pg17-trixie@sha256:137f044b0efe3d57f39b972b9b53641b1f2045b99d879e298bbf514a25787dcf
        env:
          POSTGRES_DB: ghfind_feed_test
          POSTGRES_USER: feed_test
          POSTGRES_PASSWORD: feed-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U feed_test -d ghfind_feed_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
      TURSO_DATABASE_URL: ""
      TURSO_AUTH_TOKEN: ""
      UPSTASH_REDIS_REST_URL: ""
      UPSTASH_REDIS_REST_TOKEN: ""
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.1

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Use Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release versions
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          if [ -n "$BASE_REF" ] && [ "$BASE_REF" != "0000000000000000000000000000000000000000" ]; then
            pnpm versions:check --base-ref "$BASE_REF"
          else
            pnpm versions:check
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Bootstrap disposable pgvector integration database
        env:
          FEED_DATABASE_URL: postgres://feed_test:feed-test-only@127.0.0.1:5432/ghfind_feed_test?sslmode=disable
          FEED_EXTENSION_BOOTSTRAP_ACK: I_UNDERSTAND_THIS_INSTALLS_DATABASE_EXTENSIONS
        run: go run ./cmd/ghfind-feed-bootstrap

      - name: Test Go API and worker with real PostgreSQL
        env:
          FEED_TEST_DATABASE_URL: postgres://feed_test:feed-test-only@127.0.0.1:5432/ghfind_feed_test?sslmode=disable
        run: go test ./...

      - name: Build backend release images
        run: |
          docker build --target railway --file Dockerfile.backend --tag ghfind-backend:ci .
          docker build --file Dockerfile.feed-backup --tag ghfind-feed-backup:ci .

      - name: Self-test deployment smoke
        run: pnpm smoke:deployment:selftest

      - name: Validate production deploy gate syntax
        run: |
          node --check .github/scripts/deploy-gate.mjs
          node scripts/deploy-gate-selftest.mjs

      - name: Self-test backend async smoke
        run: pnpm smoke:backend:async:selftest

      - name: Self-test backend resilience smoke
        run: pnpm smoke:backend:resilience:selftest

      - name: Production build
        run: pnpm build
