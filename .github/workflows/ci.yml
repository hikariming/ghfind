name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main, "codex/feed-**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Application checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
      TURSO_DATABASE_URL: ""
      TURSO_AUTH_TOKEN: ""
      UPSTASH_REDIS_REST_URL: ""
      UPSTASH_REDIS_REST_TOKEN: ""
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Use Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release versions
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          if [ -n "$BASE_REF" ] && [ "$BASE_REF" != "0000000000000000000000000000000000000000" ]; then
            pnpm versions:check --base-ref "$BASE_REF"
          else
            pnpm versions:check
          fi

      - name: Verify exact-checkout evidence rejection cases
        run: node --test scripts/feed-ci-evidence.test.mjs scripts/check-cf-release-workflow.test.mjs scripts/feed-github-protection.test.mjs scripts/feed-e2e-remote.test.mjs

      - name: Verify Cloudflare release workflow contract
        run: pnpm ci:check-cf-release-workflow

      - name: Verify approved application schema boundary
        run: node --test scripts/feed-platform-schema-release.test.mjs

      - name: Verify bounded snapshot format and integrity
        run: node --test scripts/feed-snapshot.test.mjs

      - name: Verify synthetic capacity evidence gates
        run: python3 scripts/test-feed-capacity-verifier.py

      - name: Verify Docker HTTP harness ownership and cleanup guards
        run: python3 scripts/test-feed-docker-http.py

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Knip dead-code dry-run (report only). Findings exist today
      # (see #208); once they are resolved this step can drop
      # `continue-on-error` and become a blocking check.
      - name: Knip (dead code dry-run)
        continue-on-error: true
        run: pnpm knip

      - name: Test
        run: pnpm test

      - name: Verify Cloudflare D1 migrations from an empty database
        run: |
          pnpm exec wrangler d1 migrations apply ghfind --local --persist-to "$RUNNER_TEMP/ghfind-d1-migrations"
          pnpm exec wrangler d1 migrations apply ghfind-feed-dev --local --persist-to "$RUNNER_TEMP/ghfind-d1-migrations"

      # Required database contracts run in the separate isolated service job.
      - name: Test Go packages
        run: go test ./...

      # Compile the explicit integration entry without claiming a Docker run.
      - name: Compile bounded Docker HTTP acceptance harness
        run: go test -tags feedportability -run '^$' ./internal/backend

      - name: Self-test deployment smoke
        run: pnpm smoke:deployment:selftest

      - name: Self-test backend async smoke
        run: pnpm smoke:backend:async:selftest

      - name: Self-test backend resilience smoke
        run: pnpm smoke:backend:resilience:selftest

      - name: Production build
        run: pnpm build

      - name: Cloudflare Worker build
        run: pnpm cf:build

      - name: Record actual successful verify checkout
        run: node scripts/feed-ci-evidence.mjs record-job verify "$RUNNER_TEMP/verify.json"
      - name: Preserve verify checkout receipt
        uses: actions/upload-artifact@v4
        with:
          name: feed-ci-job-${{ github.run_id }}-${{ github.run_attempt }}-verify
          path: ${{ runner.temp }}/verify.json
          if-no-files-found: error
          retention-days: 7

  feed-contracts:
    name: Feed storage contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17-trixie@sha256:137f044b0efe3d57f39b972b9b53641b1f2045b99d879e298bbf514a25787dcf
        env:
          POSTGRES_USER: feed
          POSTGRES_PASSWORD: feed-ci-only
          POSTGRES_DB: ghfind_feed_contract_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U feed -d ghfind_feed_contract_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CI: "true"
      FEED_TEST_DATABASE_URL: postgres://feed:feed-ci-only@127.0.0.1:5432/ghfind_feed_contract_test?sslmode=disable
      FEED_REQUIRE_POSTGRES_TESTS: "1"
      FEED_REQUIRE_S3_TESTS: "1"
      FEED_TEST_S3_ENDPOINT: http://127.0.0.1:59001
      FEED_TEST_S3_ACCESS_KEY_ID: feed-local
      FEED_TEST_S3_SECRET_ACCESS_KEY: feed-local-only-password
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Require a real PostgreSQL contract environment
        run: test -n "$FEED_TEST_DATABASE_URL"
      - name: Enable pgvector in the disposable CI database
        run: psql "$FEED_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS vector'
      - name: Start an isolated real S3 contract service
        run: |
          docker compose -p ghfind-feed-contract-ci -f ops/feed-portable-compose.yaml up -d
          for attempt in {1..30}; do
            if curl --fail --silent --max-time 1 http://127.0.0.1:59001/minio/health/live; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: PostgreSQL and pgvector contracts including migration replay
        run: go test -count=1 -v ./internal/backend
      - name: Install locked Worker contract dependencies
        working-directory: platform/feed
        run: pnpm install --frozen-lockfile
      - name: Typecheck Worker capabilities
        working-directory: platform/feed
        run: pnpm typecheck
      - name: Real workerd D1 and R2 contracts
        working-directory: platform/feed
        run: pnpm test
      - name: Build the binding adapter
        working-directory: platform/feed
        run: pnpm build
      - name: Identical API contracts against PostgreSQL and workerd
        run: node scripts/test-feed-crossprofile.mjs
      - name: Rehearse isolated D1 restore and deletion-generation fencing
        run: |
          npm ci --prefix platform/runtime
          node --test scripts/feed-snapshot-local.test.mjs
      - name: Remove disposable S3 service
        if: always()
        run: docker compose -p ghfind-feed-contract-ci -f ops/feed-portable-compose.yaml down

      - name: Record actual successful feed-contracts checkout
        run: node scripts/feed-ci-evidence.mjs record-job feed-contracts "$RUNNER_TEMP/feed-contracts.json"
      - name: Preserve feed-contracts checkout receipt
        uses: actions/upload-artifact@v4
        with:
          name: feed-ci-job-${{ github.run_id }}-${{ github.run_attempt }}-feed-contracts
          path: ${{ runner.temp }}/feed-contracts.json
          if-no-files-found: error
          retention-days: 7

  feed-runtime:
    name: Feed runtime builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: docker/setup-buildx-action@v3
      - name: Install locked Container Worker dependencies
        run: npm ci --prefix platform/runtime
      - name: Validate Container Worker and routing tests
        run: |
          npm --prefix platform/runtime run typecheck
          npm --prefix platform/runtime test
          node --test scripts/feed-platform-manifest.test.mjs
          node --test scripts/feed-platform-provision.test.mjs
          node --test scripts/feed-platform-web.test.mjs scripts/feed-platform-staging-evidence.test.mjs scripts/feed-platform-verify-deployment.test.mjs
          node --test scripts/feed-operator.test.mjs
          node --test scripts/feed-governance.test.mjs
      - name: Build the Container Worker without deployment
        run: npm --prefix platform/runtime run build
      - name: Build portable Go API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.feed
          target: api
          platforms: linux/amd64
          push: false
      - name: Build portable Go executor image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.feed
          target: worker
          platforms: linux/amd64
          push: false

      - name: Record actual successful feed-runtime checkout
        run: node scripts/feed-ci-evidence.mjs record-job feed-runtime "$RUNNER_TEMP/feed-runtime.json"
      - name: Preserve feed-runtime checkout receipt
        uses: actions/upload-artifact@v4
        with:
          name: feed-ci-job-${{ github.run_id }}-${{ github.run_attempt }}-feed-runtime
          path: ${{ runner.temp }}/feed-runtime.json
          if-no-files-found: error
          retention-days: 7

  feed-e2e:
    name: Complete local Feed E2E
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      GH_TOKEN: ""
      GITHUB_TOKEN: ""
      TURSO_DATABASE_URL: ""
      TURSO_AUTH_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Install locked complete E2E dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm -C platform/feed install --frozen-lockfile
          npm ci --prefix platform/runtime
          pnpm exec playwright install --with-deps chromium
      - name: Complete both profile journeys without skipped dependencies
        run: |
          python3 scripts/feed-e2e/harness.test.py
          node --test scripts/feed-e2e/ack-loss.test.mjs
          python3 scripts/run-feed-e2e.py --release-sha "$GITHUB_SHA" --directory "$RUNNER_TEMP/feed-complete-e2e" --execute
      - name: Validate full E2E and record actual checkout
        env:
          FEED_LOCAL_E2E_RECEIPT: ${{ runner.temp }}/feed-complete-e2e/run.json
        run: node scripts/feed-ci-evidence.mjs record-job feed-e2e "$RUNNER_TEMP/feed-e2e.json"
      - name: Preserve feed-e2e checkout receipt
        uses: actions/upload-artifact@v4
        with:
          name: feed-ci-job-${{ github.run_id }}-${{ github.run_attempt }}-feed-e2e
          path: ${{ runner.temp }}/feed-e2e.json
          if-no-files-found: error
          retention-days: 7
      - name: Preserve nonsecret full E2E outcome including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feed-local-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/feed-complete-e2e/run.json
          if-no-files-found: warn
          retention-days: 7

  release-verify:
    name: Verify release
    if: always()
    needs: [verify, feed-contracts, feed-runtime, feed-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CI_JOB_RESULTS: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download this run attempt's actual checkout receipts
        uses: actions/download-artifact@v4
        with:
          pattern: feed-ci-job-${{ github.run_id }}-${{ github.run_attempt }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/feed-ci-jobs
      - name: Require every result and actual checkout to agree
        run: node scripts/feed-ci-evidence.mjs aggregate "$RUNNER_TEMP/feed-ci-jobs" "$RUNNER_TEMP/feed-ci-evidence.json"
      - name: Publish exact-checkout evidence for staging
        uses: actions/upload-artifact@v4
        with:
          name: feed-ci-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/feed-ci-evidence.json
          if-no-files-found: error
          retention-days: 7
