groups:
  - name: ghfind-backend-extraction
    rules:
      - alert: GhfindBackendPublishFailures
        expr: sum(increase(ghfind_api_job_admissions_total{result="publish_failed"}[5m])) > 0
        for: 2m
        labels:
          severity: page
          service: ghfind-api
        annotations:
          summary: Ghfind API failed to publish durable jobs
          description: The API accepted work but could not confirm RabbitMQ publish. Check RabbitMQ availability, credentials, and API logs before admitting more scan traffic.

      - alert: GhfindWorkerJobFailures
        expr: sum(increase(ghfind_worker_jobs_failed_total[10m])) > 0
        for: 5m
        labels:
          severity: warn
          service: ghfind-worker
        annotations:
          summary: Ghfind worker recorded failed jobs
          description: Worker failures are increasing. Check the kind/result labels, recent deploys, GitHub provider health, and Turso/Upstash availability.

      - alert: GhfindWorkerDeadLetteredJobs
        expr: sum(increase(ghfind_worker_jobs_dead_lettered_total[10m])) > 0
        for: 1m
        labels:
          severity: page
          service: ghfind-worker
        annotations:
          summary: Ghfind worker dead-lettered jobs
          description: A job reached terminal failure and was published to a DLQ. Inspect the matching RabbitMQ dead queue before purging or replaying.

      - alert: GhfindScanDurationHigh
        expr: |
          sum(rate(ghfind_worker_job_duration_seconds_sum{kind="scan.quick.v1"}[10m]))
          /
          clamp_min(sum(rate(ghfind_worker_job_duration_seconds_count{kind="scan.quick.v1"}[10m])), 1)
          > 90
        for: 10m
        labels:
          severity: warn
          service: ghfind-worker
        annotations:
          summary: Ghfind scan worker latency is high
          description: Average scan job duration exceeded 90 seconds for 10 minutes. Check GitHub latency/rate limits, worker saturation, and queue backlog.

      - alert: GhfindRabbitMQScanBacklog
        expr: rabbitmq_queue_messages{queue="ghfind.scan.quick.v1"} > 50
        for: 10m
        labels:
          severity: warn
          service: ghfind-rabbitmq
        annotations:
          summary: Ghfind scan queue backlog is sustained
          description: The public scan queue has stayed above 50 messages. Scale workers or reduce admissions before API wait timeouts rise.

      - alert: GhfindRabbitMQDeadQueueNotEmpty
        expr: rabbitmq_queue_messages{queue=~"ghfind\\.(scan\\.quick|score-snapshot)\\.dead\\.v1"} > 0
        for: 5m
        labels:
          severity: page
          service: ghfind-rabbitmq
        annotations:
          summary: Ghfind RabbitMQ dead-letter queue is not empty
          description: A DLQ contains terminal failures. Record evidence, inspect message headers and job status, then decide whether to replay or purge.
