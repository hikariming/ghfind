# Disposable local contract environment. Credentials and ports are test-only.
services:
  minio:
    image: docker.io/pgsty/minio@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: feed-local
      MINIO_ROOT_PASSWORD: feed-local-only-password
    ports:
      - "127.0.0.1:${FEED_TEST_S3_PORT:-59001}:9000"
    tmpfs:
      - /data
