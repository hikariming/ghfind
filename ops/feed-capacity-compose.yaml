# Exclusive disposable synthetic capacity fixture. Never attach production volumes.
services:
  postgres:
    image: pgvector/pgvector@sha256:137f044b0efe3d57f39b972b9b53641b1f2045b99d879e298bbf514a25787dcf
    cpus: 2
    mem_limit: 2g
    shm_size: 256m
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: capacity-local-only
      POSTGRES_DB: feed_capacity_test
    ports:
      - "127.0.0.1:55441:5432"
    volumes:
      - capacity_data:/var/lib/postgresql/data
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_connections=50", "-c", "track_io_timing=on"]

  minio:
    image: docker.io/pgsty/minio@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    cpus: 0.5
    mem_limit: 512m
    command: server /data
    environment:
      MINIO_ROOT_USER: capacity-local
      MINIO_ROOT_PASSWORD: capacity-local-only-password
    ports:
      - "127.0.0.1:59002:9000"
    tmpfs:
      - /data:size=16m

volumes:
  capacity_data:
