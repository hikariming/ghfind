name: Scoring upstream canary

# TEMPLATE for the private backend repository. Nightly, runs the private suite
# against the public repo's unreleased scoring main so a breaking rubric or
# contract change is caught before it is tagged. Read-only: it never pushes,
# and it needs no credentials for the public repository.

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "public repo ref to test (default main)"
        required: false

permissions:
  contents: read
  issues: write

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check out public scoring
        uses: actions/checkout@v4
        with:
          repository: hikariming/ghfind
          ref: ${{ inputs.ref || 'main' }}
          path: .upstream
          sparse-checkout: scoring
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Point both runtimes at upstream source
        run: |
          go mod edit -replace github.com/hikariming/ghfind/scoring=./.upstream/scoring
          pnpm add "@ghfind/scoring@link:./.upstream/scoring"

      - name: Private test suite
        id: suite
        run: |
          pnpm typecheck
          pnpm test
          go test ./...

      - name: Report a break
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Upstream scoring main breaks the backend"
          body="Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID (upstream ref: ${{ inputs.ref || 'main' }})"
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then gh issue comment "$existing" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
