packages:
  - "."
  # Astro migration: shared source-only
  # packages plus the router/web/api Workers. packages/ghfind-js and
  # packages/ghfind-py are published SDKs with their own toolchains and stay out.
  - "packages/i18n"
  - "apps/*"

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
