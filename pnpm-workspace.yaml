packages:
  - "."
  # Astro migration: shared source-only
  # packages plus the router/web/api Workers. packages/ghfind-js and
  # packages/ghfind-py are published SDKs with their own toolchains and stay out.
  - "packages/i18n"
  - "apps/*"

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
minimumReleaseAgeExclude:
  - framer-motion@14.6.0
  - motion-dom@14.6.0
  - motion-utils@14.6.0
  - motion@14.6.0
  - zustand@5.0.16
overrides:
  # CVE-2026-96889 / GHSA-2464-fhr4-w9xw: libvips SVG RCE on glibc. Keep every
  # sharp copy (next, astro, miniflare) on the patched line.
  sharp: ^0.35.5
