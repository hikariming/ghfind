x-backend-environment: &backend-environment
  GHFIND_API_LISTEN_ADDR: ":8080"
  GHFIND_WORKER_METRICS_LISTEN_ADDR: ":9090"
  RABBITMQ_URL: amqp://ghfind:ghfind-local-only@rabbitmq:5672/
  TURSO_DATABASE_URL: ${TURSO_DATABASE_URL:?set TURSO_DATABASE_URL in your shell or .env}
  TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN:-}
  UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:?set UPSTASH_REDIS_REST_URL in your shell or .env}
  UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:?set UPSTASH_REDIS_REST_TOKEN in your shell or .env}
  MOSOO_API_BASE: ${MOSOO_API_BASE:-https://try.mosoo.ai/api/v1}
  MOSOO_PROJECT_AGENT_ID: ${MOSOO_PROJECT_AGENT_ID:-}
  MOSOO_PROJECT_USER_ID: ${MOSOO_PROJECT_USER_ID:-ghfind}
  FEED_MODE: ${FEED_MODE:-off}
  FEED_DATABASE_URL: ${FEED_DATABASE_URL:-postgres://feed:feed-local-only@feed-postgres:5432/ghfind_feed?sslmode=disable}
  FEED_SIGNING_SECRET: ${FEED_SIGNING_SECRET:-local-feed-signing-secret-change-me}
  FEED_CANARY_BPS: ${FEED_CANARY_BPS:-0}
  FEED_GORSE_LIVE_BPS: ${FEED_GORSE_LIVE_BPS:-0}
  FEED_SHADOW_OUTCOME_WINDOW: ${FEED_SHADOW_OUTCOME_WINDOW:-24h}
  FEED_INTERNAL_GITHUB_IDS: ${FEED_INTERNAL_GITHUB_IDS:-}
  FEED_EMBEDDING_BASE_URL: ${FEED_EMBEDDING_BASE_URL:-}
  FEED_EMBEDDING_API_KEY: ${FEED_EMBEDDING_API_KEY:-}
  FEED_EMBEDDING_MODEL: ${FEED_EMBEDDING_MODEL:-}
  FEED_EMBEDDING_DIMENSIONS: ${FEED_EMBEDDING_DIMENSIONS:-1536}
  GORSE_BASE_URL: ${GORSE_BASE_URL:-http://gorse:8088}
  GORSE_SERVER_API_KEY: ${GORSE_SERVER_API_KEY:-local-only-server-key}
  GORSE_ADMIN_API_KEY: ${GORSE_ADMIN_API_KEY:-local-only-admin-key}

services:
  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ghfind
      RABBITMQ_DEFAULT_PASS: ghfind-local-only
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  feed-postgres:
    image: pgvector/pgvector:0.8.1-pg17-trixie@sha256:137f044b0efe3d57f39b972b9b53641b1f2045b99d879e298bbf514a25787dcf
    profiles: ["feed", "gorse"]
    environment:
      POSTGRES_DB: ghfind_feed
      POSTGRES_USER: feed
      POSTGRES_PASSWORD: feed-local-only
    volumes:
      - feed-postgres-data:/var/lib/postgresql/data
      - ./ops/feed-postgres-init.sql:/docker-entrypoint-initdb.d/10-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feed -d ghfind_feed"]
      interval: 5s
      timeout: 5s
      retries: 20

  feed-migrate:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: api
    profiles: ["feed", "gorse"]
    entrypoint: ["/ghfind-feed-migrate"]
    environment:
      FEED_DATABASE_URL: postgres://feed:feed-local-only@feed-postgres:5432/ghfind_feed?sslmode=disable
    depends_on:
      feed-postgres:
        condition: service_healthy
    restart: "no"

  gorse:
    image: zhenghaoz/gorse-in-one:0.5.11@sha256:b249a44b6affabde48a88c0438ebfd810edbb91f872f8dc080286f460a4f0ee7
    profiles: ["gorse"]
    environment:
      GORSE_CACHE_STORE: postgres://gorse_local:gorse-local-only@feed-postgres:5432/ghfind_feed?sslmode=disable
      GORSE_DATA_STORE: postgres://gorse_local:gorse-local-only@feed-postgres:5432/ghfind_feed?sslmode=disable
      GORSE_SERVER_API_KEY: ${GORSE_SERVER_API_KEY:-local-only-server-key}
      GORSE_ADMIN_API_KEY: ${GORSE_ADMIN_API_KEY:-local-only-admin-key}
    volumes:
      - ./ops/gorse/config.toml:/etc/gorse/config.toml:ro
      - gorse-data:/var/lib/gorse
    depends_on:
      feed-postgres:
        condition: service_healthy
      feed-migrate:
        condition: service_completed_successfully

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: api
    environment:
      <<: *backend-environment
      # API-only authorization for internal operations. The worker never
      # accepts HTTP input and must not receive this credential.
      ADMIN_SECRET: ${ADMIN_SECRET:?set ADMIN_SECRET in your shell or .env}
      GITHUB_ROAST_CLI_API_KEY: ${GITHUB_ROAST_CLI_API_KEY:-}
      PROJECT_ANALYSIS_RECONCILE_SECRET: ${PROJECT_ANALYSIS_RECONCILE_SECRET:-}
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:-}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:-}
      AUTH_SECRET: ${AUTH_SECRET:-}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_FALLBACK_API_KEY: ${LLM_FALLBACK_API_KEY:-}
      LLM_FALLBACK_BASE_URL: ${LLM_FALLBACK_BASE_URL:-}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
      # Shared only with Vercel's BotID gateway so direct public requests cannot
      # invoke the internal verdict route. It is never given to the worker.
      GHFIND_VERDICT_GATEWAY_SECRET: ${GHFIND_VERDICT_GATEWAY_SECRET:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/ghfind-healthcheck", "http://localhost:8080/healthz", "http://localhost:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - "8080:8080"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: worker
    environment:
      <<: *backend-environment
      # The worker alone calls GitHub. Keep this PAT out of the API service and
      # never expose it in Vercel's environment. The Mosoo token is likewise
      # worker-only: only the worker creates and polls analysis threads.
      GITHUB_TOKEN: ${GITHUB_TOKEN:?set GITHUB_TOKEN in your shell or .env}
      MOSOO_API_TOKEN: ${MOSOO_API_TOKEN:-}
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/ghfind-healthcheck", "http://localhost:9090/healthz", "http://localhost:9090/readyz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - "9090:9090"

volumes:
  rabbitmq-data:
  feed-postgres-data:
  gorse-data:
